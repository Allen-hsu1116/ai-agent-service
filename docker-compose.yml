services:
  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-service:local
    container_name: ai-agent-service
    ports:
      - "8020:8020"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
    # Useful on Linux when the container needs to call a model server running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
